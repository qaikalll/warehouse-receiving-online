name: Receiving Guardian
on:
  push:
    branches: [main, 'guardian/**']
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:rules
      - run: npm run test:integration
  production-readiness:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:release
# This workflow deliberately does not deploy or change Firebase/Pages settings.
# Make both jobs required and gate the real Pages deployment before enabling release.
